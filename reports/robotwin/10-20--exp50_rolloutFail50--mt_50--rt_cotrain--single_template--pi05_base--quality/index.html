<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>RoboTwin campaign reports</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow, noarchive" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root { --bg: #fbfbfa; --fg: #1d1f21; --muted: #6b7079; --line: #e3e5e8; --card: #ffffff; --accent: #2458c5; --field: #f1f2f4;
                    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif; }
            @media (prefers-color-scheme: dark) {
              :root { --bg: #15171a; --fg: #e6e7ea; --muted: #9aa0a8; --line: #2b2f35; --card: #1c1f23; --accent: #7aa2f7; --field: #23272d; }
            }
            .staticrypt-html, .staticrypt-body { height: 100%; margin: 0; }
            .staticrypt-content { min-height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
            .staticrypt-page { width: 380px; max-width: 92vw; padding: 10vh 0 0; margin: auto; box-sizing: border-box; }
            .staticrypt-form { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.6rem 1.8rem; }
            .staticrypt-title { font-size: 1.2rem; font-weight: 650; margin: 0 0 0.3rem; }
            .staticrypt-instructions p { margin: 0; color: var(--muted); }
            .staticrypt-hr { margin: 1rem 0; border: 0; border-top: 1px solid var(--line); }
            .staticrypt-password-container { position: relative; margin: 0 0 0.8rem; }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] { width: 100%; box-sizing: border-box; font: inherit; color: var(--fg);
                    background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 0.55rem 2.4rem 0.55rem 0.7rem; outline: 0; }
            .staticrypt-form input:focus { border-color: var(--accent); }
            .staticrypt-toggle-password-visibility { cursor: pointer; height: 18px; width: 18px; opacity: 0.55; position: absolute; right: 0.7rem; top: 50%; transform: translateY(-50%); }
            @media (prefers-color-scheme: dark) { .staticrypt-toggle-password-visibility { filter: invert(1); } }
            label.staticrypt-remember { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.9rem; color: var(--muted); font-size: 0.92rem; }
            .staticrypt-form .staticrypt-decrypt-button { width: 100%; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 0.6rem; cursor: pointer; }
            .staticrypt-form .staticrypt-decrypt-button:hover { filter: brightness(0.93); }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; }
            .staticrypt-spinner { display: inline-block; width: 2rem; height: 2rem; border: 0.25em solid gray; border-right-color: transparent; border-radius: 50%; animation: spinner-border 0.75s linear infinite; }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
        </style>

                // Media vault (reports/_build/vault.py, assets/vault.js): derive the clip key from the same password and keep it
                // as a non-extractable CryptoKey in IndexedDB, so the decrypted page can load the encrypted clips without
                // asking again. The salt and iteration count are substituted by publish.sh from vault.json.
                try {
                    const vaultSalt = "qcSy5/GvAdRKaiwnTtFE9A==", vaultIter = parseInt("600000", 10);

                        const b64 = (x) => Uint8Array.from(atob(x), (c) => c.charCodeAt(0));
                        const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);

                            const r = indexedDB.open("report-vault", 1);
                            r.onupgradeneeded = () => r.result.createObjectStore("keys");
                            r.onsuccess = () => { const t = r.result.transaction("keys", "readwrite"); t.objectStore("keys").put(vk, "vault|" + vaultSalt); t.oncomplete = ok; t.onerror = ok; };
                            r.onerror = () => ok();
                        });
                    }

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
