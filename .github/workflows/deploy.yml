name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - master
  # Dispatched by robotwin-workspace reports/_build/publish.sh after it force-pushes the encrypted
  # campaign reports to a reports-* branch (a push there cannot trigger this file).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: master

      # Each reports branch is a single-commit branch holding StatiCrypt-encrypted pages, pushed by the
      # publisher of that workspace. It is served verbatim under /reports/<name>/ (Hugo copies static/
      # as is). A missing branch is tolerated.
      - name: Add the campaign reports
        run: |
          for name in robotwin vla; do
            rm -rf "static/reports/$name"
            if git clone --quiet --depth 1 --branch "reports-$name" "https://github.com/${GITHUB_REPOSITORY}.git" "static/reports/$name"; then
              rm -rf "static/reports/$name/.git"
              echo "$name reports at $(cat "static/reports/$name/version.txt" 2>/dev/null || echo unknown)"
            else
              echo "no reports-$name branch; building without it"
            fi
          done

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.124.1'  # Set your version here

      - name: Build Hugo site
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
